name: 🐧 Rebuild peng.ly

on:
  deployment_status:

permissions: {}

jobs:
  rebuild:
    name: 🐧 Ping its deploy hook
    runs-on: ubuntu-latest
    if: >-
      github.event.deployment_status.state == 'success'
      && github.event.deployment.environment == 'Production'
    env:
      HOOK: ${{ secrets.PENGLY_DEPLOY_HOOK }}
    steps:
      - name: Ask Vercel for a fresh peng.ly, so it picks up the new posts
        if: env.HOOK
        run: curl -fsS --retry 3 -X POST "$HOOK"
