# Controls GitHub's auto-generated release notes.
# Docs: https://docs.github.com/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - ignore-for-release
      - duplicate
      - invalid
      - question
  categories:
    - title: 💥 Breaking Changes
      labels:
        - breaking-change
    - title: 🔒 Security
      labels:
        - security
    - title: 📝 New Posts
      labels:
        - new-post
    - title: ✏️ Post Updates
      labels:
        - post-update
    - title: ✨ Features
      labels:
        - feature
    - title: 🎨 Look and Feel
      labels:
        - ui
    - title: 🐛 Fixes
      labels:
        - fix
    - title: 🧹 Maintenance
      labels:
        - documentation
        - maintenance
    - title: 📦 Dependencies
      labels:
        - dependencies
    - title: 🧩 Other Changes
      labels:
        - "*"
