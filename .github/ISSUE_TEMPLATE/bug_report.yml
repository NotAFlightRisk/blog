name: 🐛 Bug Report
description: Something isn't working as expected
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
      placeholder: I expected X, but Y happened.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that reliably triggers it.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Page
      description: The address where it happens, if it's on blog.peng.ly.
      placeholder: https://blog.peng.ly/hello-noot/
    validations:
      required: false

  - type: dropdown
    id: install-method
    attributes:
      label: Where are you seeing it?
      options:
        - blog.peng.ly
        - My own copy, on Vercel or a similar host
        - My own copy, built from source
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and OS, plus Node version if you're building it yourself.
      placeholder: Firefox 141, Ubuntu 24.04, Node 22
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Anything from the browser console or the server. Formatted as code automatically, so no backticks needed.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I agree to follow this project's [Code of Conduct](https://github.com/NotAFlightRisk/blog/blob/main/.github/CODE_OF_CONDUCT.md)
          required: true
